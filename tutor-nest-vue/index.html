<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ecdd" />
  <meta name="description" content="NEST 学巢 — 讲义、错题、训练与收藏，一座属于你的学院式学习空间。" />
  <meta property="og:title" content="NEST · 学巢" />
  <meta property="og:description" content="把每一次努力，变成看得见的成长。" />
  <meta property="og:type" content="website" />
  <title>NEST · 学巢 | 学习资料仓库</title>
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    html,
    body {
      margin: 0;
      background: #f3ecdd;
    }

    .boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background:
        radial-gradient(rgba(28, 26, 20, 0.12) 1px, transparent 1.2px),
        radial-gradient(900px 600px at 50% 30%, rgba(255, 197, 61, 0.35), transparent 60%),
        #f3ecdd;
      background-size: 26px 26px, 100% 100%, 100% 100%;
      color: #1c1a14;
      font-family: 'Segoe UI Variable Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      letter-spacing: 0.26em;
      font-size: 11px;
      text-transform: uppercase;
    }

    .boot__mark {
      width: 54px;
      height: 54px;
      border-radius: 13px;
      background: #1c1a14;
      position: relative;
      box-shadow: 5px 5px 0 #ed4b2a;
    }

    .boot__mark::before,
    .boot__mark::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 2px solid #fffdf6;
    }

    .boot__mark::before {
      inset: 12px;
    }

    .boot__mark::after {
      width: 10px;
      height: 10px;
      left: 22px;
      top: 22px;
      background: #ed4b2a;
      border: 2px solid #fffdf6;
      animation: boot-pulse 1.1s ease-in-out infinite alternate;
    }

    @keyframes boot-pulse {
      from { transform: scale(0.85); }
      to { transform: scale(1.15); }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="boot" aria-hidden="true">
      <div class="boot__mark"></div>
      <span>NEST · 学巢</span>
    </div>
  </div>
  <noscript>NEST 学巢需要启用 JavaScript 才能运行。</noscript>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
