spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: ${DATABASE_MIGRATIONS_ENABLED:false}

tutor:
  identity:
    csrf-secret: ${TUTOR_CSRF_SECRET}
    cookie-name: __Host-TUTOR_SESSION
    cookie-secure: true
  courseware:
    root: ${TUTOR_COURSEWARE_ROOT:./var/courseware}
    # 生产默认保持静态目录，直到配置了可写的持久卷/对象存储；切到 storage 才对外暴露托管清单
    source: ${TUTOR_COURSEWARE_SOURCE:static}
