spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: ${DATABASE_MIGRATIONS_ENABLED:false}

tutor:
  identity:
    csrf-secret: ${TUTOR_CSRF_SECRET}
    cookie-name: __Host-TUTOR_SESSION
    cookie-secure: true
  courseware:
    # 生产默认落在镜像内已创建、由 app(uid 10001) 拥有的固定目录，部署时由 compose
    # 挂持久卷覆盖（deploy/compose.yaml 的 courseware-data）。容器 read_only 时
    # 相对路径 ./var/courseware 无法创建，会导致任何发布都写盘失败。
    root: ${TUTOR_COURSEWARE_ROOT:/var/lib/tutor-base/courseware}
    # 所有正文从数据库 blob 读取（持久卷 courseware-data），不再依赖前端静态文件。
    source: ${TUTOR_COURSEWARE_SOURCE:storage}
