spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: tutor-base-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tutor_base_dev}
    username: ${DATABASE_USERNAME:tutor_base_dev}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:5}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:0}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    enabled: ${DATABASE_MIGRATIONS_ENABLED:true}
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  servlet:
    multipart:
      # 图片业务上限 10 MB（CoursewareMediaService 再校验一次）；请求上限留给 zip 导入。
      max-file-size: ${TUTOR_MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${TUTOR_MULTIPART_MAX_REQUEST_SIZE:64MB}

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

tutor:
  web:
    allowed-origins: ${TUTOR_WEB_ALLOWED_ORIGINS:}
  identity:
    session-lifetime: ${TUTOR_SESSION_LIFETIME:PT12H}
    csrf-secret: ${TUTOR_CSRF_SECRET:local-development-secret-change-before-production}
    cookie-name: ${TUTOR_SESSION_COOKIE_NAME:TUTOR_SESSION}
    cookie-secure: ${TUTOR_SESSION_COOKIE_SECURE:false}
    public-mutation-limit: ${TUTOR_PUBLIC_MUTATION_LIMIT:10}
    public-mutation-window: ${TUTOR_PUBLIC_MUTATION_WINDOW:PT1M}
    bootstrap:
      enabled: ${TUTOR_BOOTSTRAP_ENABLED:false}
      username: ${TUTOR_BOOTSTRAP_USERNAME:young}
      password: ${TUTOR_BOOTSTRAP_PASSWORD:}
  courseware:
    root: ${TUTOR_COURSEWARE_ROOT:./var/courseware}
    max-article-bytes: ${TUTOR_COURSEWARE_MAX_ARTICLE_BYTES:1048576}
    # 旧「认领」模型：false 后认领写入接口返回 410（读接口保留），改用「我的课件 + 资源目录」
    legacy-claims-enabled: ${TUTOR_COURSEWARE_LEGACY_CLAIMS:true}
    # 每个老师的正文存储配额（字节，默认 2 GB，0 表示不限）
    quota-bytes: ${TUTOR_COURSEWARE_QUOTA_BYTES:2147483648}
    # 课件图片：Supabase Storage 公开桶；上传账号只具备该桶 INSERT 权限
    max-media-bytes: ${TUTOR_COURSEWARE_MAX_MEDIA_BYTES:10485760}
    media-supabase-url: ${TUTOR_COURSEWARE_MEDIA_SUPABASE_URL:}
    media-supabase-anon-key: ${TUTOR_COURSEWARE_MEDIA_SUPABASE_ANON_KEY:}
    media-supabase-email: ${TUTOR_COURSEWARE_MEDIA_SUPABASE_EMAIL:}
    media-supabase-password: ${TUTOR_COURSEWARE_MEDIA_SUPABASE_PASSWORD:}
    media-bucket: ${TUTOR_COURSEWARE_MEDIA_BUCKET:courseware-media}
