openapi: 3.1.0
info:
  title: Tutor Base Backend API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /system/status:
    get:
      operationId: getSystemStatus
      summary: Get the backend service status
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                status: ok
                service: tutor-base-backend
                version: 0.1.0-SNAPSHOT
                time: '2026-08-14T08:30:00Z'
  /csrf:
    get:
      operationId: getCsrfToken
      summary: 获取当前浏览器会话的 CSRF token
      security: []
      responses:
        '200':
          description: Token 只应保存在前端内存中。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /sessions:
    post:
      operationId: createSession
      summary: 使用用户名和密码建立会话
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并轮换会话 Cookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /session:
    get:
      operationId: getCurrentSession
      summary: 获取当前账户的安全投影
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前已认证账户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCurrentSession
      summary: 注销并撤销当前服务端会话
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: 会话已撤销，Cookie 已清除。
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /accounts:
    post:
      operationId: registerLearnerAccount
      summary: 注册学习者账户并直接建立会话
      description: 用户名大小写不敏感且必须唯一；注册成功即成为学习者并直接登录。
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功并轮换会话 Cookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          description: 用户名已被占用，`code` 为 `username_conflict`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '429':
          $ref: '#/components/responses/Problem'
  /teacher-applications:
    post:
      operationId: submitTeacherApplication
      summary: 提交教师注册申请
      description: 只创建待审核申请，不建立会话、不创建账户；审核通过后才成为管理员。
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherApplicationRequest'
      responses:
        '201':
          description: 申请已进入待审核队列。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherApplication'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          description: 用户名已有账户或待审核申请，`code` 为 `username_conflict`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '429':
          $ref: '#/components/responses/Problem'
  /admin/teacher-applications:
    get:
      operationId: listTeacherApplications
      summary: 列出教师注册申请（仅超级管理员）
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: 按状态筛选；`all` 返回全部，缺省为 `pending`。
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: pending
      responses:
        '200':
          description: 最近 500 条申请与全局待审核数量。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherApplicationCollection'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: 不是超级管理员，`code` 为 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /admin/teacher-applications/{applicationId}/approve:
    post:
      operationId: approveTeacherApplication
      summary: 通过教师申请并创建管理员账户（仅超级管理员）
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/TeacherApplicationId'
      responses:
        '200':
          description: 管理员账户已创建；申请密码哈希被复用，申请人可直接登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedTeacherAccount'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: 申请已处理，或用户名已被占用；`code` 为 `state_conflict` 或 `username_conflict`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /admin/teacher-applications/{applicationId}/reject:
    post:
      operationId: rejectTeacherApplication
      summary: 驳回教师申请（仅超级管理员）
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/TeacherApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTeacherApplicationRequest'
      responses:
        '200':
          description: 申请已驳回，用户名可重新申请。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherApplication'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: 申请已处理，`code` 为 `state_conflict`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /account-activations/complete:
    post:
      operationId: completeAccountActivation
      summary: 使用一次性激活码设置初始密码
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteActivationRequest'
      responses:
        '204':
          description: 账户已激活；该操作不会自动登录。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /admin/account-activations:
    post:
      operationId: issueAccountActivation
      summary: 为待激活账户发行新的一次性激活码
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueActivationRequest'
      responses:
        '201':
          description: 明文激活码只在本次响应中出现。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedActivation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /me/content-grants:
    get:
      operationId: getCurrentContentGrants
      summary: 获取当前学习者获准访问的文章 ID
      description: 学习者身份只从服务端会话取得，不接受客户端传入学习者 ID。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前学习者的完整文章授权列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentGrants'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /checkins:
    get:
      operationId: getMonthCheckIns
      summary: 查询指定自然月（Asia/Shanghai）的签到概览
      description: 返回该月已签到日期、本月签到次数、今日是否已签，以及签到奖励规则。
      security:
        - sessionCookie: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: 该月的签到概览。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInMonthOverview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: checkInToday
      summary: 执行当日签到（幂等）
      description: 同日重复调用返回已签到状态，不重复发放积分；第 7、14 次签到额外奖励。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 签到结果；alreadyCheckedIn 为 true 表示当日已签（含并发重复请求）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /rewards:
    get:
      operationId: getRewardSummary
      summary: 获取当前学习者的积分、卡片收藏与收藏统计
      description: 学习者身份只从服务端会话取得，不接受客户端传入 student_id。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前学习者的积分余额、收藏卡片与统计，卡片按领取时间倒序。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /rewards/catalog:
    get:
      operationId: getRewardCatalog
      summary: 获取服务端卡池目录与当期 UP 卡
      description: 概率、卡组、卡片和 UP 轮换均由服务端数据库提供，新增卡组无需改动前端。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 抽卡价格、概率、当期 UP、全部启用卡组与卡片总数。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardCatalog'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /rewards/draws:
    post:
      operationId: drawRewardCards
      summary: 抽取收藏卡片
      description: 服务端按卡池目录决定卡片与 UP 标记，客户端不能指定卡片或概率。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '200':
          description: 抽卡后的最新积分、当期 UP 与卡片结果（可包含重复卡）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardDrawResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /achievements:
    get:
      operationId: listAchievements
      summary: 获取当前学习者的分级成就进度
      description: 成就等级与领取状态由服务端计算；浏览器不能提交学习者 ID 或奖励积分。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 成就目录、当前指标、已领取等级与可领取等级。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /achievements/{key}/claims:
    post:
      operationId: claimAchievementTier
      summary: 领取下一级已达成成就并发放积分
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/GrowthKey'
      responses:
        '200':
          description: 领取成功，返回本次奖励与最新积分余额。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthClaimResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /tasks/board:
    get:
      operationId: getTaskBoard
      summary: 获取每日、每周与限时任务进度
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 任务列表、进度、状态与刷新时间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthTaskBoard'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /tasks/{key}/accept:
    post:
      operationId: acceptGrowthTask
      summary: 接取限时任务并开始计算宽松截止时间
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/GrowthKey'
      responses:
        '204':
          description: 接取成功。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /tasks/{key}/claims:
    post:
      operationId: claimGrowthTask
      summary: 领取已完成任务奖励
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/GrowthKey'
      responses:
        '200':
          description: 领取成功，返回本次奖励与最新积分余额。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthClaimResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /articles/study-progress:
    get:
      operationId: getLearnerStudyProgress
      summary: 获取当前学习者各文章的题目与提交计数
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 只包含当前学习者获授权且已配置题目的文章。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArticleProgress' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /articles/{articleId}/study-state:
    get:
      operationId: getLearnerArticleStudyState
      summary: 获取当前学习者的文章作答状态
      description: 未批阅题目的参考答案不会发送到浏览器。
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 当前学习者的题目状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleStudyState' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /articles/{articleId}/submissions/{questionId}:
    put:
      operationId: saveLearnerSubmission
      summary: 保存当前学习者的一道作答并执行服务端自动批阅
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/ArticleId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveSubmissionRequest' }
      responses:
        '200':
          description: 保存后的作答；自动批阅为错误时，错题也在同一事务收集。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/articles/answer-key-article-ids:
    get:
      operationId: listAnswerKeyArticleIds
      summary: 列出已配置至少一道题的文章 ID
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 文章 ID 列表。
          content:
            application/json:
              schema:
                type: array
                items: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CoursewareNotClaimed' }
  /admin/articles/{articleId}/answer-keys:
    get:
      operationId: getArticleAnswerKeys
      summary: 获取文章的完整参考答案配置
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ArticleId' }]
      responses:
        '200':
          description: 完整参考答案配置。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnswerKey' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CoursewareNotClaimed' }
    put:
      operationId: replaceArticleAnswerKeys
      summary: 批量创建或替换文章参考答案配置
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceAnswerKeysRequest' }
      responses:
        '200':
          description: 保存后的完整配置。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnswerKey' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CoursewareNotClaimed' }
  /admin/articles/{articleId}/study-state:
    get:
      operationId: getAdministratorArticleStudyState
      summary: 获取指定学习者的作答与完整参考答案
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ArticleId'
        - name: learnerId
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 管理员批阅视图数据。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleStudyState' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CoursewareNotClaimed' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/learners/{learnerId}/study-progress:
    get:
      operationId: getAdministratorLearnerStudyProgress
      summary: 获取指定学习者各文章的批阅进度
      description: 只返回该学习者已获内容授权的文章进度。
      security: [{ sessionCookie: [] }]
      parameters:
        - name: learnerId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 该学习者已授权文章的文章进度列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArticleProgress' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CoursewareNotClaimed' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/articles/{articleId}/learners/{learnerId}/submissions/{questionId}/review:
    put:
      operationId: reviewLearnerSubmission
      summary: 人工批阅指定作答
