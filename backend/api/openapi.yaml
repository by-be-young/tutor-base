openapi: 3.1.0
info:
  title: Tutor Base Backend API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /system/status:
    get:
      operationId: getSystemStatus
      summary: Get the backend service status
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                status: ok
                service: tutor-base-backend
                version: 0.1.0-SNAPSHOT
                time: '2026-08-14T08:30:00Z'
  /csrf:
    get:
      operationId: getCsrfToken
      summary: 获取当前浏览器会话的 CSRF token
      security: []
      responses:
        '200':
          description: Token 只应保存在前端内存中。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /sessions:
    post:
      operationId: createSession
      summary: 使用用户名和密码建立会话
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并轮换会话 Cookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /session:
    get:
      operationId: getCurrentSession
      summary: 获取当前账户的安全投影
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前已认证账户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCurrentSession
      summary: 注销并撤销当前服务端会话
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: 会话已撤销，Cookie 已清除。
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /account-activations/complete:
    post:
      operationId: completeAccountActivation
      summary: 使用一次性激活码设置初始密码
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteActivationRequest'
      responses:
        '204':
          description: 账户已激活；该操作不会自动登录。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /admin/account-activations:
    post:
      operationId: issueAccountActivation
      summary: 为待激活账户发行新的一次性激活码
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueActivationRequest'
      responses:
        '201':
          description: 明文激活码只在本次响应中出现。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedActivation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /me/content-grants:
    get:
      operationId: getCurrentContentGrants
      summary: 获取当前学习者获准访问的文章 ID
      description: 学习者身份只从服务端会话取得，不接受客户端传入学习者 ID。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前学习者的完整文章授权列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentGrants'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /checkins:
    get:
      operationId: getMonthCheckIns
      summary: 查询指定自然月（Asia/Shanghai）的签到概览
      description: 返回该月已签到日期、本月签到次数、今日是否已签，以及签到奖励规则。
      security:
        - sessionCookie: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: 该月的签到概览。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInMonthOverview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: checkInToday
      summary: 执行当日签到（幂等）
      description: 同日重复调用返回已签到状态，不重复发放积分；第 7、14 次签到额外奖励。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 签到结果；alreadyCheckedIn 为 true 表示当日已签（含并发重复请求）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/learners:
    get:
      operationId: listLearners
      summary: List learners and their content grants
      description: Results are ordered by learnerId ascending and use an opaque keyset cursor.
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A page of learners visible to an administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerCollection'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLearner
      summary: 新增学习者及其待设置密码账户
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearnerRequest'
      responses:
        '201':
          description: 学习者已创建，初始文章授权为空。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/content-grants:
    put:
      operationId: replaceLearnerContentGrants
      summary: 完整替换一个学习者的文章授权
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceContentGrantsRequest'
      responses:
        '200':
          description: 返回替换后的学习者及文章授权。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/password:
    put:
      operationId: setLearnerPassword
      summary: 管理员直接设置或重置学习者密码
      description: 成功后账户转为已激活，并撤销该账户的所有现有会话和未使用激活码。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLearnerPasswordRequest'
      responses:
        '204':
          description: 密码已设置；响应不包含密码或哈希。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/impersonate:
    post:
      operationId: impersonateLearner
      summary: 管理员免密进入学习者账户
      description: >-
        为该学习者创建新会话并轮换 Set-Cookie 会话 Cookie；管理员的既有会话
        不会被撤销。仅可进入 role=learner 且已激活的账户。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 已切换为该学习者会话，并返回其安全投影。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-TUTOR_SESSION
  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 128
    AccountSession:
      type: object
      additionalProperties: false
      required: [accountId, learnerId, username, roles]
      properties:
        accountId:
          type: integer
          format: int64
        learnerId:
          type: [integer, 'null']
          format: int64
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [LEARNER, ADMINISTRATOR]
    CompleteActivationRequest:
      type: object
      additionalProperties: false
      required: [username, activationCode, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        activationCode:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 12
          maxLength: 128
    IssueActivationRequest:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: integer
          format: int64
          minimum: 1
    IssuedActivation:
      type: object
      additionalProperties: false
      required: [activationId, activationCode, expiresAt]
      properties:
        activationId:
          type: integer
          format: int64
        activationCode:
          type: string
        expiresAt:
          type: string
          format: date-time
    SetLearnerPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - time
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: tutor-base-backend
        version:
          type: string
          minLength: 1
        time:
          type: string
          format: date-time
    LearnerCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LearnerSummary'
        nextCursor:
          type:
            - string
            - 'null'
    LearnerSummary:
      type: object
      additionalProperties: false
      required:
        - learnerId
        - username
        - contentGrantArticleIds
      properties:
        learnerId:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
          minLength: 1
        contentGrantArticleIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
    CreateLearnerRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
    ReplaceContentGrantsRequest:
      type: object
      additionalProperties: false
      required: [articleIds]
      properties:
        articleIds:
          type: array
          maxItems: 5000
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 2147483647
    ContentGrants:
      type: object
      additionalProperties: false
      required: [articleIds]
      properties:
        articleIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
    CheckInMonthOverview:
      type: object
      additionalProperties: false
      required: [year, month, dates, monthCount, todayCheckedIn, today, pointsPerCheckIn, bonusMilestones]
      properties:
        year:
          type: integer
        month:
          type: integer
        dates:
          type: array
          description: 该月已签到的日期（ISO date）。
          items:
            type: string
            format: date
        monthCount:
          type: integer
          description: 该月已签到次数。
        todayCheckedIn:
          type: boolean
          description: 服务端 Asia/Shanghai 今日是否已签到。
        today:
          type: string
          format: date
          description: 服务端 Asia/Shanghai 今日日期。
        pointsPerCheckIn:
          type: integer
          const: 100
          description: 每次签到基础积分。
        bonusMilestones:
          type: array
          description: 额外奖励的月度签到次数节点。
          items:
            type: integer
            enum: [7, 14]
    CheckInResult:
      type: object
      additionalProperties: false
      required: [date, pointsAwarded, bonusDays, monthCount, alreadyCheckedIn, totalPoints]
      properties:
        date:
          type: string
          format: date
        pointsAwarded:
          type: integer
          description: 本次实际发放积分（含额外奖励）。
        bonusDays:
          type: [integer, 'null']
          description: 命中第 7/14 次奖励时返回 7 或 14，否则为 null。
        monthCount:
          type: integer
          description: 签到后的本月签到次数。
        alreadyCheckedIn:
          type: boolean
          description: 是否在本次请求前已签到（幂等重复或并发请求）。
        totalPoints:
          type: integer
          description: 签到后的累计积分。
    ApiProblem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
