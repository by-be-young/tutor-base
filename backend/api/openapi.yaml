openapi: 3.1.0
info:
  title: Tutor Base Backend API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /system/status:
    get:
      operationId: getSystemStatus
      summary: Get the backend service status
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                status: ok
                service: tutor-base-backend
                version: 0.1.0-SNAPSHOT
                time: '2026-08-14T08:30:00Z'
  /csrf:
    get:
      operationId: getCsrfToken
      summary: 获取当前浏览器会话的 CSRF token
      security: []
      responses:
        '200':
          description: Token 只应保存在前端内存中。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /sessions:
    post:
      operationId: createSession
      summary: 使用用户名和密码建立会话
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并轮换会话 Cookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /session:
    get:
      operationId: getCurrentSession
      summary: 获取当前账户的安全投影
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前已认证账户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCurrentSession
      summary: 注销并撤销当前服务端会话
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: 会话已撤销，Cookie 已清除。
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /account-activations/complete:
    post:
      operationId: completeAccountActivation
      summary: 使用一次性激活码设置初始密码
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteActivationRequest'
      responses:
        '204':
          description: 账户已激活；该操作不会自动登录。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /admin/account-activations:
    post:
      operationId: issueAccountActivation
      summary: 为待激活账户发行新的一次性激活码
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueActivationRequest'
      responses:
        '201':
          description: 明文激活码只在本次响应中出现。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedActivation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /me/content-grants:
    get:
      operationId: getCurrentContentGrants
      summary: 获取当前学习者获准访问的文章 ID
      description: 学习者身份只从服务端会话取得，不接受客户端传入学习者 ID。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前学习者的完整文章授权列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentGrants'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /checkins:
    get:
      operationId: getMonthCheckIns
      summary: 查询指定自然月（Asia/Shanghai）的签到概览
      description: 返回该月已签到日期、本月签到次数、今日是否已签，以及签到奖励规则。
      security:
        - sessionCookie: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: 该月的签到概览。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInMonthOverview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: checkInToday
      summary: 执行当日签到（幂等）
      description: 同日重复调用返回已签到状态，不重复发放积分；第 7、14 次签到额外奖励。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 签到结果；alreadyCheckedIn 为 true 表示当日已签（含并发重复请求）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /rewards:
    get:
      operationId: getRewardSummary
      summary: 获取当前学习者的积分与卡片收藏
      description: 学习者身份只从服务端会话取得，不接受客户端传入 student_id。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前学习者的积分余额与收藏卡片，卡片按领取时间倒序。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /rewards/milestones/{milestonePoints}/claims:
    post:
      operationId: claimRewardMilestone
      summary: 领取一个已达成的积分里程碑卡片
      description: 卡片种类和稀有度由服务端目录决定；同一学习者的同一里程碑只可领取一次。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: milestonePoints
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 200
            maximum: 6000
            multipleOf: 200
      responses:
        '201':
          description: 领取成功，返回由服务端确定的卡片。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardReward'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /articles/study-progress:
    get:
      operationId: getLearnerStudyProgress
      summary: 获取当前学习者各文章的题目与提交计数
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 只包含当前学习者获授权且已配置题目的文章。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArticleProgress' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /articles/{articleId}/study-state:
    get:
      operationId: getLearnerArticleStudyState
      summary: 获取当前学习者的文章作答状态
      description: 未批阅题目的参考答案不会发送到浏览器。
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 当前学习者的题目状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleStudyState' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /articles/{articleId}/submissions/{questionId}:
    put:
      operationId: saveLearnerSubmission
      summary: 保存当前学习者的一道作答并执行服务端自动批阅
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/ArticleId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveSubmissionRequest' }
      responses:
        '200':
          description: 保存后的作答；自动批阅为错误时，错题也在同一事务收集。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/articles/answer-key-article-ids:
    get:
      operationId: listAnswerKeyArticleIds
      summary: 列出已配置至少一道题的文章 ID
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 文章 ID 列表。
          content:
            application/json:
              schema:
                type: array
                items: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/articles/{articleId}/answer-keys:
    get:
      operationId: getArticleAnswerKeys
      summary: 获取文章的完整参考答案配置
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ArticleId' }]
      responses:
        '200':
          description: 完整参考答案配置。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnswerKey' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      operationId: replaceArticleAnswerKeys
      summary: 批量创建或替换文章参考答案配置
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceAnswerKeysRequest' }
      responses:
        '200':
          description: 保存后的完整配置。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnswerKey' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/articles/{articleId}/study-state:
    get:
      operationId: getAdministratorArticleStudyState
      summary: 获取指定学习者的作答与完整参考答案
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ArticleId'
        - name: learnerId
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 管理员批阅视图数据。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleStudyState' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/learners/{learnerId}/study-progress:
    get:
      operationId: getAdministratorLearnerStudyProgress
      summary: 获取指定学习者各文章的批阅进度
      security: [{ sessionCookie: [] }]
      parameters:
        - name: learnerId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 文章进度列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArticleProgress' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/articles/{articleId}/learners/{learnerId}/submissions/{questionId}/review:
    put:
      operationId: reviewLearnerSubmission
      summary: 人工批阅指定作答
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/ArticleId'
        - name: learnerId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewSubmissionRequest' }
      responses:
        '200':
          description: 批阅后的作答。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /wrong-book:
    get:
      operationId: listWrongBookEntries
      summary: 获取当前学习者未移除的错题
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 错题列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WrongBookEntry' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /wrong-book/entries:
    post:
      operationId: collectWrongBookEntry
      summary: 手动把文章中的一道题加入当前学习者错题本
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectWrongBookRequest' }
      responses:
        '201':
          description: 新建或复活后的错题。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WrongBookEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /wrong-book/entries/{entryId}:
    patch:
      operationId: updateWrongBookEntry
      summary: 修改当前学习者错题的学习字段
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/WrongBookEntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWrongBookRequest' }
      responses:
        '200':
          description: 更新后的错题。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WrongBookEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeWrongBookEntry
      summary: 删除手动错题，或软移除自动收集错题
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/WrongBookEntryId'
      responses:
        '204': { description: 已移除。 }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/learners:
    get:
      operationId: listLearners
      summary: List learners and their content grants
      description: Results are ordered by learnerId ascending and use an opaque keyset cursor.
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A page of learners visible to an administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerCollection'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLearner
      summary: 新增学习者及其待设置密码账户
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearnerRequest'
      responses:
        '201':
          description: 学习者已创建，初始文章授权为空。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/content-grants:
    put:
      operationId: replaceLearnerContentGrants
      summary: 完整替换一个学习者的文章授权
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceContentGrantsRequest'
      responses:
        '200':
          description: 返回替换后的学习者及文章授权。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/password:
    put:
      operationId: setLearnerPassword
      summary: 管理员直接设置或重置学习者密码
      description: 成功后账户转为已激活，并撤销该账户的所有现有会话和未使用激活码。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLearnerPasswordRequest'
      responses:
        '204':
          description: 密码已设置；响应不包含密码或哈希。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/impersonate:
    post:
      operationId: impersonateLearner
      summary: 管理员免密进入学习者账户
      description: >-
        为该学习者创建新会话并轮换 Set-Cookie 会话 Cookie；管理员的既有会话
        不会被撤销。仅可进入 role=learner 且已激活的账户。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 已切换为该学习者会话，并返回其安全投影。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ArticleId:
      name: articleId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    WrongBookEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-TUTOR_SESSION
  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 128
    AccountSession:
      type: object
      additionalProperties: false
      required: [accountId, learnerId, username, roles]
      properties:
        accountId:
          type: integer
          format: int64
        learnerId:
          type: [integer, 'null']
          format: int64
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [LEARNER, ADMINISTRATOR]
    CompleteActivationRequest:
      type: object
      additionalProperties: false
      required: [username, activationCode, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        activationCode:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 12
          maxLength: 128
    IssueActivationRequest:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: integer
          format: int64
          minimum: 1
    IssuedActivation:
      type: object
      additionalProperties: false
      required: [activationId, activationCode, expiresAt]
      properties:
        activationId:
          type: integer
          format: int64
        activationCode:
          type: string
        expiresAt:
          type: string
          format: date-time
    SetLearnerPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - time
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: tutor-base-backend
        version:
          type: string
          minLength: 1
        time:
          type: string
          format: date-time
    LearnerCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LearnerSummary'
        nextCursor:
          type:
            - string
            - 'null'
    LearnerSummary:
      type: object
      additionalProperties: false
      required:
        - learnerId
        - username
        - contentGrantArticleIds
      properties:
        learnerId:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
          minLength: 1
        contentGrantArticleIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
    CreateLearnerRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
    ReplaceContentGrantsRequest:
      type: object
      additionalProperties: false
      required: [articleIds]
      properties:
        articleIds:
          type: array
          maxItems: 5000
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 2147483647
    ContentGrants:
      type: object
      additionalProperties: false
      required: [articleIds]
      properties:
        articleIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
    CheckInMonthOverview:
      type: object
      additionalProperties: false
      required: [year, month, dates, monthCount, todayCheckedIn, today, pointsPerCheckIn, bonusMilestones]
      properties:
        year:
          type: integer
        month:
          type: integer
        dates:
          type: array
          description: 该月已签到的日期（ISO date）。
          items:
            type: string
            format: date
        monthCount:
          type: integer
          description: 该月已签到次数。
        todayCheckedIn:
          type: boolean
          description: 服务端 Asia/Shanghai 今日是否已签到。
        today:
          type: string
          format: date
          description: 服务端 Asia/Shanghai 今日日期。
        pointsPerCheckIn:
          type: integer
          const: 100
          description: 每次签到基础积分。
        bonusMilestones:
          type: array
          description: 额外奖励的月度签到次数节点。
          items:
            type: integer
            enum: [7, 14]
    CheckInResult:
      type: object
      additionalProperties: false
      required: [date, pointsAwarded, bonusDays, monthCount, alreadyCheckedIn, totalPoints]
      properties:
        date:
          type: string
          format: date
        pointsAwarded:
          type: integer
          description: 本次实际发放积分（含额外奖励）。
        bonusDays:
          type: [integer, 'null']
          description: 命中第 7/14 次奖励时返回 7 或 14，否则为 null。
        monthCount:
          type: integer
          description: 签到后的本月签到次数。
        alreadyCheckedIn:
          type: boolean
          description: 是否在本次请求前已签到（幂等重复或并发请求）。
        totalPoints:
          type: integer
          description: 签到后的累计积分。
    RewardSummary:
      type: object
      additionalProperties: false
      required: [points, collection]
      properties:
        points:
          type: integer
          format: int64
          minimum: 0
        collection:
          type: array
          items:
            $ref: '#/components/schemas/CardReward'
    ArticleProgress:
      type: object
      additionalProperties: false
      required: [articleId, totalQuestions, submittedQuestions, pendingReviews]
      properties:
        articleId: { type: integer, format: int64 }
        totalQuestions: { type: integer, minimum: 0 }
        submittedQuestions: { type: integer, minimum: 0 }
        pendingReviews: { type: integer, minimum: 0 }
    ArticleStudyState:
      type: object
      additionalProperties: false
      required: [articleId, questions]
      properties:
        articleId: { type: integer, format: int64 }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuestionState' }
    QuestionState:
      type: object
      additionalProperties: false
      required: [questionId, answerText, autoGrade, submission]
      properties:
        questionId: { type: string }
        answerText: { type: [string, 'null'], description: 学习者未获准查看时为 null。 }
        autoGrade: { type: [boolean, 'null'], description: 只在管理员响应中返回。 }
        submission:
          anyOf:
            - $ref: '#/components/schemas/Submission'
            - type: 'null'
    Submission:
      type: object
      additionalProperties: false
      required: [id, articleId, learnerId, questionId, answerText, reviewStatus, reviewResult, submittedAt, reviewedAt]
      properties:
        id: { type: integer, format: int64 }
        articleId: { type: integer, format: int64 }
        learnerId: { type: integer, format: int64 }
        questionId: { type: string }
        answerText: { type: string }
        reviewStatus: { type: string, enum: [pending, reviewed] }
        reviewResult: { type: [string, 'null'], enum: [correct, partial, wrong, null] }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
    SaveSubmissionRequest:
      type: object
      additionalProperties: false
      required: [answerText]
      properties:
        answerText: { type: string, maxLength: 50000 }
    AnswerKey:
      type: object
      additionalProperties: false
      required: [questionId, answerText, autoGrade, updatedAt]
      properties:
        questionId: { type: string }
        answerText: { type: string }
        autoGrade: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ReplaceAnswerKeysRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/AnswerKeyInput' }
    AnswerKeyInput:
      type: object
      additionalProperties: false
      required: [questionId, answerText, autoGrade]
      properties:
        questionId: { type: string, minLength: 1, maxLength: 200 }
        answerText: { type: string, maxLength: 50000 }
        autoGrade: { type: boolean }
    ReviewSubmissionRequest:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: string, enum: [correct, partial, wrong] }
    CollectWrongBookRequest:
      type: object
      additionalProperties: false
      required: [sourceArticleId, sourceQuestionId, myAnswer]
      properties:
        sourceArticleId: { type: integer, format: int64, minimum: 1 }
        sourceQuestionId: { type: string, minLength: 1, maxLength: 200 }
        myAnswer: { type: string, maxLength: 50000 }
    UpdateWrongBookRequest:
      type: object
      additionalProperties: false
      properties:
        myAnswer: { type: string, maxLength: 50000 }
        wrongReason: { type: string, maxLength: 10000 }
        tags:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string, maxLength: 20000 }
        mastered: { type: boolean }
    WrongBookEntry:
      type: object
      additionalProperties: false
      required: [id, learnerId, correctAnswer, myAnswer, wrongReason, tags, note,
                 sourceArticleId, sourceQuestionId, manual, mastered, wrongCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        learnerId: { type: integer, format: int64 }
        correctAnswer: { type: string }
        myAnswer: { type: string }
        wrongReason: { type: string }
        tags:
          type: array
          items: { type: string }
        note: { type: string }
        sourceArticleId: { type: [integer, 'null'], format: int64 }
        sourceQuestionId: { type: [string, 'null'] }
        manual: { type: boolean }
        mastered: { type: boolean }
        wrongCount: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CardReward:
      type: object
      additionalProperties: false
      required: [id, milestonePoints, cardKey, setKey, rarity, claimedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        milestonePoints:
          type: integer
          format: int64
          minimum: 200
          maximum: 6000
          multipleOf: 200
        cardKey:
          type: string
          minLength: 1
        setKey:
          type: string
          enum: [flame, aurora, galaxy, forest]
        rarity:
          type: string
          enum: [common, rare]
        claimedAt:
          type: string
          format: date-time
    ApiProblem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
