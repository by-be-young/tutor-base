  /admin/learners:
    get:
      operationId: listLearners
      summary: List learners and their content grants
      description: >-
        Results are ordered by learnerId ascending and use an opaque keyset cursor.
        结果排除已关联角色为 administrator 的账户的学习者行；未关联账户的历史学习者仍会返回。
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A page of learners visible to an administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerCollection'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLearner
      summary: 新增测试学员及其待设置密码账户
      description: 管理端新增入口固定创建测试学员（`isTest=true`，不进入管理统计）；同时写入待激活账户，并自动由创建它的管理员认领。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearnerRequest'
      responses:
        '201':
          description: 测试学员已创建，初始文章授权为空。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}:
    delete:
      operationId: deleteLearner
      summary: 删除学习者及其账户
      description: >-
        仅可删除当前管理员自己认领的学习者；未认领或由其他管理员认领时返回 403。
        关联管理员账户的学习者与特殊测试学员受保护，不能删除。
        账户会话、激活码与学习数据在同一事务中级联删除。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: 学习者及其账户数据已删除。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/LearnerNotClaimed'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/LearnerProtected'
        '503':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/claim:
    put:
      operationId: claimLearner
      summary: 由当前管理员认领学习者
      description: >-
        未认领或已被当前管理员认领时幂等成功；已被其他管理员认领时返回
        409 learner_already_claimed。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 认领后的学习者。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: releaseLearnerClaim
      summary: 释放当前管理员对学习者的认领
      description: >-
        未认领时幂等成功；已被其他管理员认领时返回 409 learner_already_claimed。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: 认领已释放。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/content-grants:
    put:
      operationId: replaceLearnerContentGrants
      summary: 完整替换一个学习者的科目归属与文章授权
      description: >-
        `enrolledSubjects` 表示开通的科目，`articleIds` 表示具体文章授权；两者相互独立。
        开通科目不会自动授权该科目下任何文章。未传 `enrolledSubjects` 时保留既有科目，
        便于旧客户端只更新文章授权。科目必须在当前管理员“我的课件”范围内。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceContentGrantsRequest'
      responses:
        '200':
          description: 返回替换后的学习者及文章授权。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/CoursewareNotClaimed'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/password:
    put:
      operationId: setLearnerPassword
      summary: 管理员直接设置或重置学习者密码
      description: >-
        只能设置当前管理员自己认领的学习者密码；未认领或由其他管理员认领时返回 403。
        成功后账户转为已激活，并撤销该账户的所有现有会话和未使用激活码。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLearnerPasswordRequest'
      responses:
        '204':
          description: 密码已设置；响应不包含密码或哈希。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/LearnerNotClaimed'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /admin/courseware-catalog/sync:
    post:
      operationId: syncCoursewareCatalog
      summary: 同步前端静态课件目录
      description: >-
        按 articleId upsert 课件目录的学科与标题，并刷新 updatedAt；不会删除请求中未出现的条目。
        管理端每次进入时调用，重复调用结果一致。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursewareCatalogSyncRequest'
      responses:
        '200':
          description: 已同步的目录条目数。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareCatalogSyncResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /admin/courseware-claims:
    get:
      operationId: getCoursewareClaims
      summary: 获取当前管理员显式认领的学科、单篇课件、排除与已放弃课件
      description: >-
        只返回显式记录，不包含由学科认领派生覆盖的课件。excludedArticleIds 是当前管理员
        在已认领学科下单独释放、尚未重新认领的课件；abandonedArticleIds 是当前管理员
        主动放弃的课件，不计入其待认领，可在 scope=abandoned 查看。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前管理员的显式认领与排除。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareClaims'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/courseware-claims/subjects/{subject}:
    put:
      operationId: claimCoursewareSubject
      summary: 认领一个学科及其全部课件
      description: >-
        认领学科后自动覆盖该学科当前及未来同步的全部课件，并清除该学科下此前的单篇排除与放弃记录，
        恢复全部课件。重复认领幂等，返回首次认领时间。
        学科必须存在于课件目录，否则返回 404 resource_not_found。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/SubjectName'
      responses:
        '200':
          description: 学科认领结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareSubjectClaim'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: releaseCoursewareSubject
      summary: 释放当前管理员的学科认领
      description: 幂等删除；单篇课件认领不受影响，该学科的排除记录一并清理，仅由学科覆盖的课件回到待认领。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/SubjectName'
      responses:
        '204':
          description: 已释放（或本就不存在）。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /admin/courseware-claims/articles/{articleId}:
    put:
      operationId: claimCoursewareArticle
      summary: 单独认领一篇课件
      description: >-
        幂等；若该篇此前在已认领学科下被单独释放或已被放弃，本次认领会清除排除与放弃记录并恢复可见；
        学科已覆盖时无需物化单篇认领。课件必须存在于课件目录，否则返回 404 resource_not_found。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 课件认领结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareArticleClaim'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: releaseCoursewareArticle
      summary: 释放当前管理员的单篇课件认领或学科覆盖下的单篇课件
      description: >-
        幂等 204。删除该管理员的单篇认领；若该篇仍由其已认领学科覆盖，则写入排除记录，
        该课件从“我的课件”与业务页消失并回到待认领，之后可再次单独认领恢复。
        学科认领本身不受影响。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '204':
          description: 已释放（或本就不存在）。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /admin/courseware-claims/articles/{articleId}/abandonment:
    post:
      operationId: abandonCoursewareArticle
      summary: 放弃一篇课件
      description: >-
        幂等 204。将课件移入当前管理员的“已放弃的课件”，不再计入其待认领；若该篇仍由
        其已认领学科覆盖，同时写入排除记录使其从“我的课件”消失。之后可通过
        PUT /admin/courseware-claims/articles/{articleId} 重新认领恢复。课件必须存在，否则 404。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '204':
          description: 已放弃（或本就已经放弃）。
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /admin/courseware-claims/catalog:
    get:
      operationId: getCoursewareClaimCatalog
      summary: 按认领范围查询课件目录
      description: >-
        subjects 始终返回目录中的全部学科及认领摘要；items 按 scope 过滤：
        mine 为当前管理员可见课件（学科认领覆盖且未排除、未被放弃，或单篇认领），
        unclaimed 为没有任何管理员有效认领、且未被当前管理员放弃的课件（含当前管理员在学科覆盖下释放的单篇，带 excluded=true），
        abandoned 为当前管理员主动放弃的课件，
        all 为全部课件并带 claimedBy 归属与 excluded/abandoned 标记。排序为学科、articleId。
      security:
        - sessionCookie: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [mine, unclaimed, abandoned, all]
            default: mine
      responses:
        '200':
          description: 课件目录与认领状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareClaimCatalog'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/analytics/overview:
    get:
      operationId: getAdministratorAnalyticsOverview
      summary: 获取管理员首页统计概览
      description: >-
        学习者数量与 /admin/learners 口径一致（排除 administrator 角色的学习者行，并排除测试学员）。
        待批阅与近 7 天提交只统计当前管理员“我的课件”范围内、非测试学员的作答；
        pendingReviewTarget 为最早一条待批阅作答（无则为 null），用于“去批阅”直达对应习题。
        courseware.unclaimed 为没有任何管理员认领、且未被当前管理员放弃的课件数。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 管理员概览统计。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorAnalyticsOverview'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/analytics/activity:
    get:
      operationId: getAdministratorAnalyticsActivity
      summary: 获取管理员“我的课件”范围内的每日活动趋势
      description: >-
        按 Asia/Shanghai 自然日统计当前管理员可见课件的提交数与批阅数，日期升序并补零。
        测试学员的提交与批阅不计入；days 取值 7～90，默认 30。
      security:
        - sessionCookie: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 90
            default: 30
      responses:
        '200':
          description: 每日提交与批阅趋势。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorAnalyticsActivity'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/learners/{learnerId}/profile:
    get:
      operationId: getAdministratorLearnerProfile
      summary: 获取单个学习者的学习与成长详情
      description: >-
        积分、累计积分、等级与签到为学习者全局数据；分学科进度、近期作答与每日提交
        只统计当前管理员“我的课件”范围，且分学科进度只含该学习者已授权的文章。
        只能查看当前管理员自己认领的学习者；未认领或由其他管理员认领时返回 403。
      security:
        - sessionCookie: []
      parameters:
        - name: learnerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
