    delete:
      operationId: removeWrongBookEntry
      summary: 删除手动错题，或软移除自动收集错题
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/WrongBookEntryId'
      responses:
        '204': { description: 已移除。 }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
