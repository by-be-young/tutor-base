          $ref: '#/components/responses/Problem'
  /admin/courseware/export:
    get:
      operationId: exportCourseware
      summary: 导出 zip（manifest.json + articles/**.md + answers.json）
      security:
        - sessionCookie: []
      parameters:
        - name: subject
          in: query
          schema:
            type: string
        - name: articleIds
          in: query
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: zip 包。
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/courseware/import:
    post:
      operationId: importCourseware
      summary: 导入 zip（结果为独立草稿，不建立来源关系）
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: overwrite
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 导入报告。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareImportReport'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /admin/courseware/templates:
    get:
      operationId: listCoursewareTemplates
      summary: 模板库（通用模板 + 指定科目模板）
      security:
        - sessionCookie: []
      parameters:
        - name: subject
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 模板列表（不含正文）。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoursewareTemplate'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: saveCoursewareTemplate
      summary: 把正文存为模板（同科目同类型同名覆盖）
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursewareTemplateSaveRequest'
      responses:
        '200':
          description: 保存后的模板。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareTemplate'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/courseware/templates/{templateId}:
    get:
      operationId: getCoursewareTemplate
      summary: 取模板正文
      security:
        - sessionCookie: []
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: markdown 正文。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareSkeleton'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCoursewareTemplate
      summary: 停用模板
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 已停用。
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /admin/courseware/workspace/manifest:
    get:
      operationId: getCoursewareWorkspaceManifest
      summary: Git 工作区清单（只含路径与 hash，无正文）
      security:
        - sessionCookie: []
      parameters:
        - name: subject
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 当前版本清单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareWorkspaceManifest'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/courseware/workspace/files:
    get:
      operationId: pullCoursewareWorkspaceFiles
      summary: 拉取正文（路径 → markdown）
      security:
        - sessionCookie: []
      parameters:
        - name: subject
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 正文映射。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareWorkspaceFiles'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /admin/courseware/workspace/push:
    post:
      operationId: pushCoursewareWorkspace
      summary: 推送变更并发布新版本
      description: >-
        `files` 覆盖同路径、`deletedPaths` 移除、其余保持现状。`baseVersion` 与当前版本不一致返回 409；
        布局 id 未注册或残留模板变量返回 400。一次推送即一个 release，与在线编辑器走同一条发布路径。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursewareWorkspacePushRequest'
      responses:
        '200':
          description: 推送结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareWorkspacePushResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /admin/courseware/overview:
    get:
      operationId: getCoursewareOverview
      summary: 「我的课件」概览（科目 / 版本 / 草稿与待处理数量）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 概览。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursewareOverview'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

components:
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ArticleId:
      name: articleId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SubjectName:
      name: subject
      in: path
      required: true
      description: URL 编码的学科名称，例如 %E9%AB%98%E4%B8%AD%E5%8C%96%E5%AD%A6（高中化学）。
      schema: { type: string, minLength: 1, maxLength: 100 }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    WrongBookEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    GrowthKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,64}$'
    TeacherApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-TUTOR_SESSION
  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    CoursewareNotClaimed:
      description: >-
        当前管理员未认领该课件或该学科，无法访问或修改其数据；
        课件未认领时 `code` 为 `courseware_not_claimed`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    LearnerNotClaimed:
      description: >-
        学习者尚未由当前管理员认领（或由其他管理员认领），不能查看详情、设置密码、
        进入账号或删除；`code` 为 `learner_not_claimed`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    LearnerProtected:
      description: >-
        学习者受保护，不能删除。关联管理员账户时 `code` 为 `administrator_learner_protected`；
        特殊测试学员时 `code` 为 `special_test_learner_protected`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 128
    AccountSession:
      type: object
      additionalProperties: false
      required: [accountId, learnerId, username, roles, superAdmin]
      properties:
        accountId:
          type: integer
          format: int64
        learnerId:
          type: [integer, 'null']
          format: int64
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [LEARNER, ADMINISTRATOR]
        superAdmin:
          type: boolean
          description: 是否持有超级管理员标记；只有该标记可以审核教师注册申请。
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 6
          maxLength: 128
    TeacherApplicationRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 6
          maxLength: 128
    TeacherApplication:
      type: object
      additionalProperties: false
      required: [id, username, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
        rejectionReason:
          type: [string, 'null']
          maxLength: 500
        approvedAccountId:
          type: [integer, 'null']
          format: int64
    TeacherApplicationCollection:
      type: object
      additionalProperties: false
      required: [items, pendingCount]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/TeacherApplication'
        pendingCount:
          type: integer
          format: int64
          minimum: 0
    ApprovedTeacherAccount:
      type: object
      additionalProperties: false
      required: [applicationId, accountId, username, role, approvedAt]
      properties:
        applicationId:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          const: ADMINISTRATOR
        approvedAt:
          type: string
          format: date-time
    RejectTeacherApplicationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    CompleteActivationRequest:
      type: object
      additionalProperties: false
      required: [username, activationCode, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        activationCode:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 12
          maxLength: 128
    IssueActivationRequest:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: integer
          format: int64
          minimum: 1
    IssuedActivation:
      type: object
      additionalProperties: false
      required: [activationId, activationCode, expiresAt]
      properties:
        activationId:
          type: integer
          format: int64
        activationCode:
          type: string
        expiresAt:
          type: string
          format: date-time
    SetLearnerPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - time
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: tutor-base-backend
        version:
          type: string
          minLength: 1
        time:
          type: string
          format: date-time
    LearnerCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LearnerSummary'
        nextCursor:
          type:
            - string
            - 'null'
    LearnerSummary:
      type: object
      additionalProperties: false
      required:
        - learnerId
        - username
        - isTest
        - isSpecialTest
        - contentGrantArticleIds
        - enrolledSubjects
      properties:
        learnerId:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
          minLength: 1
        isTest:
          type: boolean
          description: 是否为测试学员；测试学员不参与管理员侧活跃度与动态统计。
        isSpecialTest:
          type: boolean
          description: >-
            是否为特殊测试学员（全局最多一个，必定同时是测试学员）。
            特殊测试学员拥有全部课件权限且积分固定为高值。
        contentGrantArticleIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        enrolledSubjects:
          type: array
          description: 管理员为学员开通的科目；与具体文章授权相互独立。
          items:
            type: string
            minLength: 1
            maxLength: 50
        claimedByAccountId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: 认领该学员的管理员账户 ID；未认领为 null。
        claimedByUsername:
          type: [string, 'null']
          description: 认领该学员的管理员用户名；未认领为 null。
        claimedAt:
          type: [string, 'null']
          format: date-time
          description: 认领时间（UTC）；未认领为 null。
        lastActivityAt:
          type: [string, 'null']
          format: date-time
          description: 最近学习活动时间（作答、错题、签到或登录）；无记录为 null。
    CreateLearnerRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
    ReplaceContentGrantsRequest:
      type: object
      additionalProperties: false
      required: [articleIds]
      properties:
        articleIds:
          type: array
          maxItems: 5000
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 2147483647
        enrolledSubjects:
          type: array
          maxItems: 100
          description: >-
            学员开通的科目。省略时保留既有科目；传入空数组表示取消全部科目。
            开通科目不会自动授权该科目下的文章。
          items:
            type: string
            minLength: 1
            maxLength: 50
    CoursewareCatalogSyncRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/CoursewareCatalogSyncItem'
    CoursewareCatalogSyncItem:
      type: object
      additionalProperties: false
      required: [articleId, subject]
      properties:
        articleId:
          type: integer
          format: int64
          minimum: 1
        subject:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: [string, 'null']
          maxLength: 300
    CoursewareCatalogSyncResult:
      type: object
      additionalProperties: false
      required: [synced]
      properties:
        synced:
          type: integer
          minimum: 0
    CoursewareClaims:
      type: object
      additionalProperties: false
      required: [subjectClaims, articleClaims, excludedArticleIds, abandonedArticleIds]
      properties:
        subjectClaims:
          type: array
          items:
            type: string
        articleClaims:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        excludedArticleIds:
          type: array
          description: 当前管理员在已认领学科下单独释放（排除）的课件，按 articleId 升序。
          items:
            type: integer
            format: int64
            minimum: 1
        abandonedArticleIds:
          type: array
          description: 当前管理员主动放弃的课件，按 articleId 升序；不计入其待认领。
          items:
            type: integer
            format: int64
            minimum: 1
    CoursewareSubjectClaim:
      type: object
      additionalProperties: false
      required: [subject, claimedAt]
      properties:
        subject:
          type: string
        claimedAt:
          type: string
          format: date-time
    CoursewareArticleClaim:
      type: object
      additionalProperties: false
      required: [articleId, claimedAt]
      properties:
        articleId:
          type: integer
          format: int64
          minimum: 1
        claimedAt:
          type: string
          format: date-time
    ClaimBy:
      type: object
      additionalProperties: false
      required: [accountId, username]
      properties:
        accountId:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
    SubjectClaimSummary:
      type: object
      additionalProperties: false
      required: [subject, total, mine, claimedByOthers]
      properties:
        subject:
          type: string
        total:
          type: integer
          minimum: 0
        mine:
          type: boolean
          description: 当前管理员是否认领了该学科。
        claimedByOthers:
          type: array
          description: 其他认领该学科的管理员用户名。
          items:
            type: string
    CoursewareCatalogItem:
      type: object
      additionalProperties: false
      required: [articleId, subject, title, individuallyClaimed, coveredBySubjectClaim, excluded, abandoned, claimedBy]
      properties:
        articleId:
          type: integer
          format: int64
          minimum: 1
        subject:
          type: string
        title:
          type: [string, 'null']
        individuallyClaimed:
          type: boolean
          description: 当前管理员是否单独认领了该课件。
        coveredBySubjectClaim:
          type: boolean
          description: 当前管理员是否通过学科认领覆盖了该课件（被排除时为 false）。
        excluded:
          type: boolean
          description: 当前管理员是否在学科覆盖下单独释放（排除）了该课件。
        abandoned:
          type: boolean
          description: 当前管理员是否已主动放弃该课件；放弃后不再计入其待认领。
        claimedBy:
          type: array
          description: 所有对该课件有效的认领者（排除该管理员自己的排除项）。
          items:
            $ref: '#/components/schemas/ClaimBy'
    CoursewareClaimCatalog:
      type: object
      additionalProperties: false
      required: [subjects, items]
      properties:
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectClaimSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoursewareCatalogItem'
    ContentGrants:
      type: object
      additionalProperties: false
      required: [articleIds, allArticles]
      properties:
        articleIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        allArticles:
          type: boolean
          description: true 表示特殊测试学员拥有全部文章权限，前端应放行静态目录中的全部文章。
    CheckInMonthOverview:
      type: object
      additionalProperties: false
      required: [year, month, dates, monthCount, todayCheckedIn, today, pointsPerCheckIn, bonusMilestones]
      properties:
        year:
          type: integer
        month:
          type: integer
        dates:
          type: array
          description: 该月已签到的日期（ISO date）。
          items:
            type: string
            format: date
        monthCount:
          type: integer
          description: 该月已签到次数。
        todayCheckedIn:
          type: boolean
          description: 服务端 Asia/Shanghai 今日是否已签到。
        today:
          type: string
          format: date
          description: 服务端 Asia/Shanghai 今日日期。
        pointsPerCheckIn:
          type: integer
          const: 100
          description: 每次签到基础积分。
        bonusMilestones:
          type: array
          description: 额外奖励的月度签到次数节点。
          items:
            type: integer
            enum: [7, 14]
    CheckInResult:
      type: object
      additionalProperties: false
      required: [date, pointsAwarded, bonusDays, monthCount, alreadyCheckedIn, totalPoints]
      properties:
        date:
          type: string
          format: date
        pointsAwarded:
          type: integer
          description: 本次实际发放积分（含额外奖励）。
        bonusDays:
          type: [integer, 'null']
          description: 命中第 7/14 次奖励时返回 7 或 14，否则为 null。
        monthCount:
          type: integer
          description: 签到后的本月签到次数。
        alreadyCheckedIn:
          type: boolean
          description: 是否在本次请求前已签到（幂等重复或并发请求）。
        totalPoints:
          type: integer
          description: 签到后的累计积分。
    RewardSummary:
      type: object
      additionalProperties: false
      required: [points, lifetimePoints, collection, stats]
      properties:
        points:
          type: integer
          format: int64
          minimum: 0
          description: 当前可用积分（抽卡会消耗）。
        lifetimePoints:
          type: integer
          format: int64
          minimum: 0
          description: 累计获得积分，只增不减；前端据此计算等级。
        collection:
          type: array
          items:
            $ref: '#/components/schemas/CardReward'
        stats:
          $ref: '#/components/schemas/RewardStats'
