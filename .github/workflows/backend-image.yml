name: Backend Container Image

on:
  push:
    branches:
      - codex/java-backend-migration
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend with PostgreSQL Testcontainers
        working-directory: backend
        run: bash mvnw -B -ntp clean verify

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/by-be-young/tutor-base-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
