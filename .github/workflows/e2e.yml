name: End-to-End CI

on:
  workflow_call:
  pull_request:
    paths:
      - 'backend/**'
      - 'tutor-nest-vue/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend unit, HTTP and PostgreSQL integration tests
        working-directory: backend
        run: bash mvnw -B -ntp clean verify

  browser-journey:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tutor_base_e2e
          POSTGRES_USER: tutor_base_e2e
          POSTGRES_PASSWORD: e2e-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor_base_e2e -d tutor_base_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/tutor_base_e2e
      DATABASE_USERNAME: tutor_base_e2e
      DATABASE_PASSWORD: e2e-database-password
      DATABASE_MIGRATIONS_ENABLED: 'true'
      TUTOR_CSRF_SECRET: e2e-only-csrf-secret-with-more-than-thirty-two-bytes
      TUTOR_SESSION_COOKIE_NAME: TUTOR_SESSION
      TUTOR_SESSION_COOKIE_SECURE: 'false'
      TUTOR_WEB_ALLOWED_ORIGINS: http://127.0.0.1:3000
      TUTOR_BOOTSTRAP_USERNAME: e2e-admin
      TUTOR_BOOTSTRAP_PASSWORD: E2e-admin-password-2026
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: E2e-admin-password-2026
      VITE_API_BASE_URL: http://127.0.0.1:8080/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Provision isolated E2E administrator
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: bootstrap-admin
          TUTOR_BOOTSTRAP_ENABLED: 'true'
        run: bash mvnw -B -ntp spring-boot:run
      - name: Start backend
        working-directory: backend
        run: |
          nohup bash mvnw -B -ntp spring-boot:run > ../backend-e2e.log 2>&1 &
          echo $! > ../backend-e2e.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - name: Run browser journey
        run: npm run test:e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            backend-e2e.log
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
