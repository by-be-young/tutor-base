name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - 'deploy/compose.yaml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'backend/**'
      - 'database/**'
      - 'deploy/compose.yaml'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run fast unit tests
        run: bash mvnw -B -ntp test -DexcludedGroups=integration

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Confirm Docker for PostgreSQL migration tests
        run: docker info
      - name: Run HTTP and PostgreSQL integration tests
        run: bash mvnw -B -ntp test -Dgroups=integration
