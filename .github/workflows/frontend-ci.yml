name: Frontend CI

on:
  pull_request:
    paths:
      - 'tutor-nest-vue/**'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/api/openapi.yaml'
      - 'redocly.yaml'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'tutor-nest-vue/**'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/api/openapi.yaml'
      - 'redocly.yaml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test frontend gateways and security behavior
        run: npm run test:frontend
      - name: Validate OpenAPI contract
        run: npm run test:openapi
      - name: Build Vue identity integration
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080/api/v1
        run: npm run build
