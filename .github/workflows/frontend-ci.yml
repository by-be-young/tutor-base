name: Frontend CI

on:
  pull_request:
    paths:
      - 'tutor-nest-vue/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - codex/java-backend-migration
    paths:
      - 'tutor-nest-vue/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build Vue identity integration
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080/api/v1
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
