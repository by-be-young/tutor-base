services:
  migration:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable commit-SHA tag}
    profiles: ["release"]
    env_file:
      - backend.env
      - migration.env
    environment:
      DATABASE_MIGRATIONS_ENABLED: "true"
      TUTOR_BOOTSTRAP_ENABLED: "false"
    command:
      - --spring.main.web-application-type=none
      - --tutor.migration-only=true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:size=32m,mode=1777

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable commit-SHA tag}
    restart: unless-stopped
    env_file:
      - backend.env
    environment:
      # 课件正文与发布清单的落盘根目录：必须落在可写且持久化的卷上，
      # 否则 read_only 容器里每次发布都会写盘失败（500）。
      TUTOR_COURSEWARE_ROOT: /var/lib/tutor-base/courseware
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - courseware-data:/var/lib/tutor-base/courseware
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 768m
    pids_limit: 256
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # 持久化课件正文（blob）与版本清单（manifest）；容器重建/重新部署不丢已发布内容。
  courseware-data:
