services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable commit-SHA tag}
    restart: unless-stopped
    env_file:
      - backend.env
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 768m
    pids_limit: 256
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
